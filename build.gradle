plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.example.tacticalpistol'
version = '1.0.0'
base { archivesName = 'tacticalpistol' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { tacticalpistol { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_id: 'tacticalpistol', mod_name: 'Tactical Pistol',
                             mod_version: project.version, mod_authors: 'Community',
                             mod_description: 'Vanilla-style fictional tactical pistol.']
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
